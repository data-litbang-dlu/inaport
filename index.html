<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Operasional Viewer (Auto Load)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        .table-container::-webkit-scrollbar { height: 12px; width: 12px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .sub-table th, .sub-table td { font-size: 0.75rem; padding: 4px 8px; border: 1px solid #e2e8f0; }
        .sub-table th { background-color: #f8fafc; font-weight: 600; color: #475569; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="container mx-auto px-4 py-8 max-w-[95%]">
        
        <div class="mb-8 flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-bold text-blue-800">Data Operasional Kapal</h1>
                <p class="text-sm text-gray-500 mt-1">Viewer Database Otomatis</p>
            </div>
            
            <div class="mt-4 md:mt-0 flex gap-4 items-center">
                <div class="px-4 py-2 bg-blue-50 rounded-lg border border-blue-100 flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span class="text-xs font-medium text-blue-700">Sumber: <span id="db-source-name" class="font-bold">...</span></span>
                </div>

                <button onclick="loadSampleData()" class="text-xs text-blue-600 underline hover:text-blue-800">
                    Gunakan Data Dummy (Fallback)
                </button>
            </div>
        </div>

        <div id="status" class="hidden mb-4 p-4 bg-blue-50 text-blue-700 rounded-lg border border-blue-100 animate-pulse flex items-center gap-2">
            <svg class="animate-spin h-5 w-5 text-blue-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="status-text">Menghubungkan ke server...</span>
        </div>

        <div id="error" class="hidden mb-4 p-4 bg-red-50 text-red-700 rounded-lg border border-red-100 font-medium text-sm"></div>

        <div id="controls" class="hidden mb-6 flex flex-col gap-4">
            <div class="flex flex-col md:flex-row gap-2 justify-between w-full">
                
                <div class="flex flex-col md:flex-row gap-2 flex-grow">
                    <input type="text" id="searchInput" placeholder="Cari Nama Kapal / Perusahaan..." 
                        class="flex-grow md:flex-grow-0 md:w-1/4 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    
                    <select id="routeSelect" class="flex-grow md:flex-grow-0 md:w-1/4 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
                        <option value="">-- Pilih Rute (Semua) --</option>
                        </select>
                    
                    <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
                        Terapkan
                    </button>
                    
                    <button id="resetBtn" class="bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 font-medium py-2 px-4 rounded-lg transition-colors shadow-sm">
                        Reset
                    </button>
                </div>
                
                <div class="flex items-center gap-2 self-end md:self-center">
                    <span class="text-sm text-gray-600">Baris:</span>
                    <select id="rowsPerPage" class="p-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-blue-500 focus:border-blue-500">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="table-wrapper" class="hidden bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
            <div class="table-container overflow-x-auto min-h-[300px]">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800 text-white sticky top-0 z-10 shadow-sm">
                        <tr id="table-headers" class="text-xs uppercase tracking-wider whitespace-nowrap">
                            </tr>
                    </thead>
                    <tbody id="table-body" class="text-sm divide-y divide-gray-200">
                        </tbody>
                </table>
            </div>
            
            <div id="pagination-controls" class="p-4 bg-gray-50 border-t border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="text-sm text-gray-600">
                    Menampilkan <span id="start-row" class="font-bold">0</span> - <span id="end-row" class="font-bold">0</span> dari <span id="total-rows" class="font-bold">0</span> data
                </div>
                
                <div class="flex items-center gap-2">
                    <button id="btnPrev" class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                        &larr; Sebelumnya
                    </button>
                    
                    <span id="page-indicator" class="text-sm font-medium text-gray-700 px-2">
                        Halaman 1
                    </span>
                    
                    <button id="btnNext" class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                        Selanjutnya &rarr;
                    </button>
                </div>
            </div>
        </div>

        <div id="empty-state" class="hidden text-center py-20">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-100 mb-4">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path>
                </svg>
            </div>
            <h3 class="text-lg font-medium text-gray-900">Tidak ada data</h3>
            <p class="text-gray-500 mt-1">Gagal memuat database atau hasil pencarian kosong.</p>
        </div>

    </div>

    <script>
        // --- KONFIGURASI FILE DATABASE ---
        const DB_URL = './Data 2024.db'; 
        
        // --- KONFIGURASI RUTE & KODE ---
        const portCodes = {
            "Surabaya": "IDSUB",
            "Banjarmasin": "IDBDJ",
            "Balikpapan": "IDBPN",
            "Kumai": "IDKUM",
            "Sampit": "IDSMQ",
            "Makassar": "IDMAK",
            "Lembar": "IDLBR",
            "Labuan Bajo": "IDLBO",
            "Maumere": "IDMOF",
            "Ende": "IDENE",
            "Kupang": "IDKOE",
            "Waingapu": "IDWGP",
            "Semarang": "IDSRG",
            "Ketapang Kalbar": "IDKTG",
            "Parepare": "IDPAP",
            "Baubau": "IDBAU",
            "Batulicin": "IDKBU",
            // Penambahan kode standar untuk yang belum ada di list (agar fitur tetap jalan)
            "Donggala": "IDDGL", 
            "Pontianak": "IDPNK",
            "Selayar": "IDSLY"
        };

        const routeList = [
            "Surabaya - Banjarmasin", "Banjarmasin - Surabaya",
            "Surabaya - Balikpapan", "Balikpapan - Surabaya",
            "Balikpapan - Donggala", "Donggala - Balikpapan",
            "Surabaya - Kumai", "Kumai - Surabaya",
            "Surabaya - Sampit", "Sampit - Surabaya",
            "Surabaya - Makassar", "Makassar - Surabaya",
            "Surabaya - Lembar", "Lembar - Surabaya",
            "Surabaya - Labuan Bajo", "Labuan Bajo - Maumere",
            "Maumere - Labuan Bajo", "Labuan Bajo - Surabaya",
            "Labuan Bajo - Ende", "Ende - Kupang",
            "Lembar - Waingapu", "Waingapu - Kupang",
            "Semarang - Kumai", "Kumai - Semarang",
            "Semarang - Sampit", "Sampit - Semarang",
            "Semarang - Pontianak", "Pontianak - Semarang",
            "Semarang - Ketapang Kalbar", "Ketapang Kalbar - Semarang",
            "Parepare - Balikpapan", "Balikpapan - Parepare",
            "Makassar - Baubau", "Baubau - Makassar",
            "Makassar - Batulicin", "Batulicin - Makassar",
            "Parepare - Batulicin", "Batulicin - Parepare",
            "Makassar - Selayar", "Selayar - Baubau",
            "Baubau - Selayar", "Selayar - Makassar"
        ];

        let db = null;
        let allData = [];        
        let filteredData = [];   
        let dbColumns = [];      
        let currentPage = 1;
        let rowsPerPage = 10;

        const config = {
            locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${filename}`
        };

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('db-source-name').textContent = DB_URL;
            initRouteOptions(); // Inisialisasi Dropdown
            autoLoadDatabase();
        });

        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('resetBtn').addEventListener('click', resetSearch);
        document.getElementById('routeSelect').addEventListener('change', performSearch); // Trigger search saat dropdown berubah
        
        document.getElementById('rowsPerPage').addEventListener('change', (e) => {
            rowsPerPage = parseInt(e.target.value);
            currentPage = 1;
            renderCurrentPage();
        });
        document.getElementById('btnPrev').addEventListener('click', () => changePage(-1));
        document.getElementById('btnNext').addEventListener('click', () => changePage(1));
        
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });

        function initRouteOptions() {
            const select = document.getElementById('routeSelect');
            routeList.forEach(route => {
                const parts = route.split(" - ");
                if (parts.length === 2) {
                    const origin = parts[0];
                    const destination = parts[1];
                    
                    // Kita cari Kode Inaport untuk TUJUAN
                    const destCode = portCodes[destination];
                    
                    if (destCode) {
                        // Value format: "KODE_TUJUAN|NAMA_ASAL"
                        // Contoh: "IDSUB|BANJARMASIN" (Untuk rute Banjarmasin - Surabaya)
                        const optionValue = `${destCode}|${origin}`;
                        const option = document.createElement('option');
                        option.value = optionValue;
                        option.textContent = route;
                        select.appendChild(option);
                    }
                }
            });
        }

        async function autoLoadDatabase() {
            showLoading(true, "Mengunduh file database...");
            hideError();

            try {
                const SQL = await initSqlJs(config);
                const response = await fetch(DB_URL);
                
                if (!response.ok) {
                    if(response.status === 404) throw new Error(`File '${DB_URL}' tidak ditemukan.`);
                    throw new Error(`Gagal memuat database (${response.status}).`);
                }

                const buf = await response.arrayBuffer();
                db = new SQL.Database(new Uint8Array(buf));
                
                showLoading(true, "Membaca tabel...");
                loadTableData();

            } catch (err) {
                console.error(err);
                showError(err.message);
                document.getElementById('empty-state').classList.remove('hidden');
            } finally {
                showLoading(false);
            }
        }

        async function loadSampleData() {
            showLoading(true, "Membuat Data Dummy...");
            hideError();
            document.getElementById('db-source-name').textContent = "Data Dummy (Memori)";
            
            try {
                const SQL = await initSqlJs(config);
                db = new SQL.Database();
                
                // Menambahkan kolom INAPORT CODE dan TIBA DARI untuk testing filter
                const cols = ["NOMOR PKK", "KAPAL", "PERUSAHAAN", "STATUS", "BENDERA", "INAPORT CODE", "TIBA DARI", "DETAIL_BONGKAR_MUAT"];
                db.run(`CREATE TABLE data_operasional (${cols.map(c => `"${c}" TEXT`).join(', ')});`);

                const sampleJson = JSON.stringify({
                    "BONGKAR": [{"KOMODITIBONGKAR": "BATUBARA", "JENISBONGKAR": "Curah", "TONBONGKAR": "5000", "UNITBONGKAR": "0"}], 
                    "MUAT": [{"KOMODITIMUAT": "SEMEN", "JENISMUAT": "Bag", "TONMUAT": "1000", "UNITMUAT": "20000"}]
                });

                // Dummy data disesuaikan agar filter bisa dicoba
                // Contoh 1: Banjarmasin - Surabaya (Tiba di IDSUB dari Banjarmasin)
                db.run(`INSERT INTO data_operasional VALUES ('PKK-1', 'KM. TEST 01', 'PT. PELAYARAN A', 'SANDAR', 'INDONESIA', 'IDSUB', 'BANJARMASIN', '${sampleJson}')`);
                
                // Contoh 2: Surabaya - Banjarmasin (Tiba di IDBDJ dari Surabaya)
                db.run(`INSERT INTO data_operasional VALUES ('PKK-2', 'KM. TEST 02', 'PT. PELAYARAN B', 'LABUH', 'INDONESIA', 'IDBDJ', 'SURABAYA', '${sampleJson}')`);

                // Isi sisanya random
                for(let i=3; i<=25; i++) {
                    db.run(`INSERT INTO data_operasional VALUES 
                    ('PKK-${i}', 'KM. AUTO LOAD ${i}', 'PT. CONTOH ${i}', '${i%2==0?"SANDAR":"LABUH"}', 'INDONESIA', 'IDSUB', 'JAKARTA', '${sampleJson}')`);
                }

                loadTableData();
            } catch (e) {
                showError("Gagal membuat data dummy: " + e.message);
            } finally {
                showLoading(false);
            }
        }

        function loadTableData() {
            try {
                let tableName = "data_operasional";
                const tables = db.exec("SELECT name FROM sqlite_master WHERE type='table'");
                
                if (tables.length > 0 && tables[0].values.length > 0) {
                   const foundTable = tables[0].values.flat().find(t => t === "data_operasional");
                   if (!foundTable) tableName = tables[0].values[0][0];
                } else {
                    throw new Error("Database kosong.");
                }

                // Query dasar
                const result = db.exec(`SELECT * FROM "${tableName}"`);
                if (result.length === 0 || result[0].values.length === 0) throw new Error(`Tabel '${tableName}' kosong.`);

                dbColumns = result[0].columns;
                allData = result[0].values; 
                
                // Terapkan search jika ada input tersimpan, jika tidak reset
                performSearch();

                document.getElementById('empty-state').classList.add('hidden');
                document.getElementById('table-wrapper').classList.remove('hidden');
                document.getElementById('controls').classList.remove('hidden');

            } catch (err) {
                showError("Error: " + err.message);
            }
        }

        function renderHeader(columns) {
            const thead = document.getElementById('table-headers');
            thead.innerHTML = '';
            columns.forEach(col => {
                const th = document.createElement('th');
                th.className = "px-6 py-3 text-left text-xs font-medium uppercase tracking-wider border-b border-gray-700";
                th.innerText = col.replace(/_/g, ' ');
                thead.appendChild(th);
            });
        }

        function performSearch() {
            const textInput = document.getElementById('searchInput').value.toUpperCase();
            const routeInput = document.getElementById('routeSelect').value; // Format: "CODE|ORIGIN"
            
            let routeDestCode = "";
            let routeOriginName = "";

            if (routeInput) {
                const parts = routeInput.split('|');
                routeDestCode = parts[0];
                routeOriginName = parts[1].toUpperCase();
            }

            // Cari index kolom penting
            const idxInaport = dbColumns.indexOf("INAPORT CODE");
            const idxTibaDari = dbColumns.indexOf("TIBA DARI");
            
            // Validasi jika kolom tidak ditemukan di database
            const isRouteFilterActive = routeInput && idxInaport !== -1 && idxTibaDari !== -1;

            filteredData = allData.filter(row => {
                // 1. Filter Text (Global)
                const matchesText = textInput === "" || row.some(cell => String(cell).toUpperCase().includes(textInput));
                
                // 2. Filter Rute (Spesifik)
                let matchesRoute = true;
                if (isRouteFilterActive) {
                    const cellCode = String(row[idxInaport] || "").toUpperCase();
                    const cellOrigin = String(row[idxTibaDari] || "").toUpperCase();
                    
                    // Logic: WHERE "INAPORT CODE" = ID... AND "TIBA DARI" LIKE %ASAL%
                    matchesRoute = (cellCode === routeDestCode) && (cellOrigin.includes(routeOriginName));
                }

                return matchesText && matchesRoute;
            });

            if (routeInput && (idxInaport === -1 || idxTibaDari === -1)) {
                console.warn("Kolom 'INAPORT CODE' atau 'TIBA DARI' tidak ditemukan di database. Filter rute diabaikan.");
            }

            currentPage = 1;
            renderHeader(dbColumns); // Render header ulang (opsional)
            renderCurrentPage();

            // Tampilkan empty state jika hasil filter 0
            if (filteredData.length === 0) {
                document.getElementById('table-wrapper').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
                document.querySelector('#empty-state h3').innerText = "Data tidak ditemukan";
                document.querySelector('#empty-state p').innerText = "Coba ubah kata kunci atau filter rute.";
            } else {
                document.getElementById('table-wrapper').classList.remove('hidden');
                document.getElementById('empty-state').classList.add('hidden');
            }
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('routeSelect').selectedIndex = 0;
            performSearch();
        }

        function renderCurrentPage() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const totalItems = filteredData.length;
            const totalPages = Math.ceil(totalItems / rowsPerPage);

            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;

            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = Math.min(startIndex + rowsPerPage, totalItems);
            const pageData = filteredData.slice(startIndex, endIndex);

            pageData.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-white hover:bg-blue-50' : 'bg-gray-50 hover:bg-blue-50';
                
                row.forEach((cell, i) => {
                    const td = document.createElement('td');
                    td.className = "px-6 py-4 whitespace-nowrap border-b border-gray-100 text-gray-700 align-top";
                    
                    if (dbColumns[i].toUpperCase() === "DETAIL_BONGKAR_MUAT") {
                        td.innerHTML = formatDetailJSON(cell);
                    } else {
                        td.textContent = cell !== null ? cell : '-';
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            document.getElementById('start-row').innerText = totalItems === 0 ? 0 : startIndex + 1;
            document.getElementById('end-row').innerText = endIndex;
            document.getElementById('total-rows').innerText = totalItems;
            document.getElementById('page-indicator').innerText = `Halaman ${currentPage} dari ${totalPages || 1}`;

            document.getElementById('btnPrev').disabled = currentPage <= 1;
            document.getElementById('btnNext').disabled = currentPage >= totalPages;
        }

        function changePage(direction) {
            currentPage += direction;
            renderCurrentPage();
        }

        function formatDetailJSON(jsonInput) {
            if (!jsonInput) return '<span class="text-gray-400">-</span>';
            try {
                let data;
                if (typeof jsonInput === 'object') data = jsonInput;
                else data = JSON.parse(jsonInput);
                if (typeof data === 'string') try { data = JSON.parse(data); } catch(e) {}

                let html = '<div class="flex flex-col gap-3 min-w-[300px] max-w-[500px]">';
                let hasContent = false;

                if (data.BONGKAR && Array.isArray(data.BONGKAR) && data.BONGKAR.length > 0) {
                    hasContent = true;
                    html += `
                    <div class="bg-green-50 p-2 rounded border border-green-200 shadow-sm">
                        <div class="flex items-center gap-1 mb-1">
                            <span class="text-xs font-bold text-green-800 bg-green-200 px-2 py-0.5 rounded">BONGKAR ⬇️</span>
                        </div>
                        <table class="w-full sub-table bg-white">
                            <thead><tr><th>Komoditi</th><th>Jenis</th><th class="text-right">Ton</th><th class="text-right">Unit</th></tr></thead>
                            <tbody>${data.BONGKAR.map(item => `<tr><td class="font-medium text-gray-700">${item.KOMODITIBONGKAR || '-'}</td><td class="text-xs text-gray-500">${item.JENISBONGKAR || '-'}</td><td class="text-right font-mono">${item.TONBONGKAR || '0'}</td><td class="text-right font-mono">${item.UNITBONGKAR || '0'}</td></tr>`).join('')}</tbody>
                        </table>
                    </div>`;
                }

                if (data.MUAT && Array.isArray(data.MUAT) && data.MUAT.length > 0) {
                    hasContent = true;
                    html += `
                    <div class="bg-blue-50 p-2 rounded border border-blue-200 shadow-sm">
                        <div class="flex items-center gap-1 mb-1">
                            <span class="text-xs font-bold text-blue-800 bg-blue-200 px-2 py-0.5 rounded">MUAT ⬆️</span>
                        </div>
                        <table class="w-full sub-table bg-white">
                            <thead><tr><th>Komoditi</th><th>Jenis</th><th class="text-right">Ton</th><th class="text-right">Unit</th></tr></thead>
                            <tbody>${data.MUAT.map(item => `<tr><td class="font-medium text-gray-700">${item.KOMODITIMUAT || '-'}</td><td class="text-xs text-gray-500">${item.JENISMUAT || '-'}</td><td class="text-right font-mono">${item.TONMUAT || '0'}</td><td class="text-right font-mono">${item.UNITMUAT || '0'}</td></tr>`).join('')}</tbody>
                        </table>
                    </div>`;
                }
                html += '</div>';
                return hasContent ? html : '<span class="text-gray-400 italic">-</span>';
            } catch (e) {
                return `<span class="text-red-500 text-xs font-bold">⚠️ Invalid Format</span>`;
            }
        }

        function showLoading(isLoading, text = "Memproses database...") {
            const el = document.getElementById('status');
            document.getElementById('status-text').innerText = text;
            if (isLoading) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.innerHTML = `<strong>Error:</strong> ${msg}`;
            el.classList.remove('hidden');
        }
        
        function hideError() {
            document.getElementById('error').classList.add('hidden');
        }
    </script>
</body>
</html>
