<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Inaport</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .table-container::-webkit-scrollbar { height: 12px; width: 12px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .sub-table th, .sub-table td { font-size: 0.75rem; padding: 4px 8px; border: 1px solid #e2e8f0; }
        .sub-table th { background-color: #f8fafc; font-weight: 600; color: #475569; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="container mx-auto px-4 py-8 max-w-[95%]">
        
        <div class="mb-8 flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-bold text-blue-800">Data Inaport 2019-2024</h1>
                <p class="text-sm text-gray-500 mt-1">19 Pelabuhan</p>
            </div>
            
            <div class="mt-4 md:mt-0 flex flex-col sm:flex-row gap-4 items-center">
                <!-- Year Selector -->
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <select id="yearSelect" class="appearance-none bg-blue-50 border border-blue-200 text-blue-900 text-sm font-bold py-2.5 pl-10 pr-10 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer hover:bg-blue-100 transition-all shadow-sm">
                        <option value="Data 2024.parquet" selected>Data Tahun 2024</option>
                        <option value="Data 2023.parquet">Data Tahun 2023</option>
                        <option value="Data 2022.parquet">Data Tahun 2022</option>
                        <option value="Data 2021.parquet">Data Tahun 2021</option>
                        <option value="Data 2020.parquet">Data Tahun 2020</option>
                        <option value="Data 2019.parquet">Data Tahun 2019</option>
                        <!-- DEBUG ONLY -->
                        <!-- <option value="Data 2019-2024.parquet">Semua Data (2019-2024)</option> -->
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-blue-600">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>

                <div class="px-4 py-2 bg-gray-50 rounded-lg border border-gray-200 flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span class="text-xs font-medium text-gray-600">Sumber: <span id="db-source-name" class="font-bold">...</span></span>
                </div>

                <div id="header-count" class="px-4 py-2 bg-gray-50 rounded-lg border border-gray-200 flex items-center gap-2">
                    <span class="text-xs font-medium text-gray-600">Jumlah data: <span id="db-filtered-count" class="font-bold">0</span>
                    </span>
                </div>
            </div>
        </div>

        <div id="status" class="hidden mb-4 p-4 bg-blue-50 text-blue-700 rounded-lg border border-blue-100 animate-pulse flex items-center gap-2">
            <svg class="animate-spin h-5 w-5 text-blue-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="status-text">Menghubungkan ke DuckDB...</span>
        </div>

        <div id="error" class="hidden mb-4 p-4 bg-red-50 text-red-700 rounded-lg border border-red-100 font-medium text-sm"></div>

        <div id="controls" class="hidden mb-6 flex flex-col gap-4">
            <div class="flex flex-col md:flex-row gap-2 justify-between w-full">
                
                <div class="flex flex-col md:flex-row gap-2 flex-grow">
                    <input type="text" id="searchInput" placeholder="Cari Nama Kapal / Perusahaan..." 
                        class="flex-grow md:flex-grow-0 md:w-1/4 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    
                    <select id="routeSelect" class="flex-grow md:flex-grow-0 md:w-1/4 p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
                        <option value="">-- Pilih Rute (Semua) --</option>
                        </select>
                    
                    <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
                        Terapkan
                    </button>
                    
                    <button id="resetBtn" class="bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 font-medium py-2 px-4 rounded-lg transition-colors shadow-sm">
                        Reset
                    </button>
                </div>
                
                <div class="flex items-center gap-2 self-end md:self-center">
                    <span class="text-sm text-gray-600">Baris:</span>
                    <select id="rowsPerPage" class="p-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-blue-500 focus:border-blue-500">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="500">500</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="table-wrapper" class="hidden bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
            <div class="table-container overflow-x-auto min-h-[300px]">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800 text-white sticky top-0 z-10 shadow-sm">
                        <tr id="table-headers" class="text-xs uppercase tracking-wider whitespace-nowrap">
                            </tr>
                    </thead>
                    <tbody id="table-body" class="text-sm divide-y divide-gray-200">
                        </tbody>
                </table>
            </div>
            
            <div id="pagination-controls" class="p-4 bg-gray-50 border-t border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="text-sm text-gray-600">
                    Menampilkan <span id="start-row" class="font-bold">0</span> - <span id="end-row" class="font-bold">0</span> dari <span id="total-rows" class="font-bold">0</span> data
                </div>
                
                <div class="flex items-center gap-2">
                    <button id="btnPrev" class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                        &larr; Sebelumnya
                    </button>
                    
                    <span id="page-indicator" class="text-sm font-medium text-gray-700 px-2">
                        Halaman 1
                    </span>
                    
                    <button id="btnNext" class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                        Selanjutnya &rarr;
                    </button>
                </div>
            </div>
        </div>

        <div id="empty-state" class="hidden text-center py-20">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-100 mb-4">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path>
                </svg>
            </div>
            <h3 class="text-lg font-medium text-gray-900">Tidak ada data</h3>
            <p class="text-gray-500 mt-1">Gagal memuat database atau hasil pencarian kosong.</p>
        </div>

    </div>

    <script type="module">
        import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm';

        // --- KONFIGURASI FILE ---
        let currentDbUrl = 'Data 2024.parquet'; 
        
        // --- KONFIGURASI RUTE (Tetap Sama) ---
        const portCodes = {
            "Surabaya": "IDSUB", "Banjarmasin": "IDBDJ", "Balikpapan": "IDBPN", "Kumai": "IDKUM",
            "Sampit": "IDSMQ", "Makassar": "IDMAK", "Lembar": "IDLBR", "Labuan Bajo": "IDLBO",
            "Maumere": "IDMOF", "Ende": "IDENE", "Kupang": "IDKOE", "Waingapu": "IDWGP",
            "Semarang": "IDSRG", "Ketapang Kalbar": "IDKTG", "Parepare": "IDPAP",
            "Baubau": "IDBAU", "Batulicin": "IDKBU", "Donggala": "IDDGL", 
            "Pontianak": "IDPNK", "Selayar": "IDSLY"
        };

        const routeList = [
            "Surabaya - Banjarmasin", "Banjarmasin - Surabaya", "Surabaya - Balikpapan", "Balikpapan - Surabaya",
            "Balikpapan - Donggala", "Donggala - Balikpapan", "Surabaya - Kumai", "Kumai - Surabaya",
            "Surabaya - Sampit", "Sampit - Surabaya", "Surabaya - Makassar", "Makassar - Surabaya",
            "Surabaya - Lembar", "Lembar - Surabaya", "Surabaya - Labuan Bajo", "Labuan Bajo - Maumere",
            "Maumere - Labuan Bajo", "Labuan Bajo - Surabaya", "Labuan Bajo - Ende", "Ende - Kupang",
            "Lembar - Waingapu", "Waingapu - Kupang", "Semarang - Kumai", "Kumai - Semarang",
            "Semarang - Sampit", "Sampit - Semarang", "Semarang - Pontianak", "Pontianak - Semarang",
            "Semarang - Ketapang Kalbar", "Ketapang Kalbar - Semarang", "Parepare - Balikpapan", "Balikpapan - Parepare",
            "Makassar - Baubau", "Baubau - Makassar", "Makassar - Batulicin", "Batulicin - Makassar",
            "Parepare - Batulicin", "Batulicin - Parepare", "Makassar - Selayar", "Selayar - Baubau",
            "Baubau - Selayar", "Selayar - Makassar"
        ];

        let db = null;
        let conn = null;
        let allData = [];        
        let filteredData = [];   
        let dbColumns = [];      
        let currentPage = 1;
        let rowsPerPage = 10;

        // --- INISIALISASI DUCKDB ---
        async function initDuckDB() {
            try {
                // console.log("🚀 Memulai DuckDB...");
                const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
                const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);
                
                const worker_url = URL.createObjectURL(
                    new Blob([`importScripts("${bundle.mainWorker}");`], {type: 'text/javascript'})
                );

                const worker = new Worker(worker_url);
                const logger = new duckdb.ConsoleLogger();
                db = new duckdb.AsyncDuckDB(logger, worker);
                
                await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
                conn = await db.connect();
                
                // console.log("✅ DuckDB Siap!");
                autoLoadDatabase();
            } catch (err) {
                // console.error(err);
                showError("Gagal Inisialisasi DuckDB: " + err.message);
            }
        }

        // --- LOAD DATABASE (VERSI PEMBAHARUAN: FORCE MATERIALIZATION) ---
        async function autoLoadDatabase() {
            showLoading(true, `Mengunduh ${currentDbUrl}...`);
            hideError();
            
            document.getElementById('table-wrapper').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('db-source-name').textContent = currentDbUrl;

            try {
                if (!db || !conn) return;

                // console.log(`📡 Fetching file: ${currentDbUrl}`);
                
                // 1. Download File
                const response = await fetch(currentDbUrl);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                const arrayBuffer = await response.arrayBuffer();
                
                // console.log("✅ Download Selesai. Bytes:", arrayBuffer.byteLength);

                if (arrayBuffer.byteLength === 0) throw new Error("File kosong (0 bytes).");

                showLoading(true, "Membangun Tabel Data...");

                // 2. Register Buffer dengan nama yang AMAN (tanpa spasi/karakter aneh)
                // Kita pakai nama fix 'temp_source.parquet' agar DuckDB tidak bingung dengan URL
                await db.registerFileBuffer('temp_source.parquet', new Uint8Array(arrayBuffer));
                
                // 3. DEBUG: Cek apakah DuckDB mengenali skema/kolomnya
                // console.log("🔍 Menganalisis Struktur Parquet...");
                const schemaCheck = await conn.query(`DESCRIBE SELECT * FROM read_parquet('temp_source.parquet')`);
                // console.table(schemaCheck.toArray().map(r => r.toJSON()));

                // 4. STRATEGI BARU: Buat Tabel Internal (Materialize)
                // Ini memaksa DuckDB membongkar parquet dan menyimpannya di memori sebagai tabel SQL biasa
                // console.log("⚙️ Membuat Tabel Internal...");
                await conn.query(`DROP TABLE IF EXISTS my_table`); 
                await conn.query(`CREATE TABLE my_table AS SELECT * FROM read_parquet('temp_source.parquet')`);
                
                // 5. Query dari TABEL (bukan dari file)
                // Kita juga cek jumlah baris dulu
                const countResult = await conn.query(`SELECT count(*) as total FROM my_table`);
                const totalRows = Number(countResult.toArray()[0].toJSON().total);
                // console.log(`📊 Total Baris Terdeteksi: ${totalRows}`);

                if (totalRows === 0) {
                    throw new Error("Parquet terbaca tapi isinya 0 baris. Kemungkinan kesalahan saat export Python.");
                }

                // Ambil data
                const result = await conn.query(`SELECT * FROM my_table`);
                const arrowJson = result.toArray().map(r => r.toJSON());

                if (arrowJson.length > 0) {
                    dbColumns = Object.keys(arrowJson[0]);
                    allData = arrowJson.map(row => {
                        return dbColumns.map(col => {
                            let val = row[col];
                            // Handle BigInt aman
                            if (typeof val === 'bigint') return val.toString();
                            return val;
                        });
                    });
                } else {
                    dbColumns = [];
                    allData = [];
                }

                performSearch(); 
                document.getElementById('table-wrapper').classList.remove('hidden');
                document.getElementById('controls').classList.remove('hidden');

            } catch (err) {
                // console.error("❌ ERROR:", err);
                showError(`Gagal memuat data: <br>${err.message}`);
                document.getElementById('empty-state').classList.remove('hidden');
            } finally {
                showLoading(false);
                // Bersihkan memori file buffer jika perlu (opsional)
                // await db.registerFileBuffer('temp_source.parquet', new Uint8Array([])); 
            }
        }
        // --- Event Listeners & Helper Functions tetap sama seperti sebelumnya ---
        // (Copy bagian bawah dari kode sebelumnya: Event Listeners, performSearch, dll)
        
        // --- Copy-Paste Helper Functions di sini ---
        window.addEventListener('DOMContentLoaded', () => {
            initRouteOptions();
            initDuckDB();
        });

        document.getElementById('yearSelect').addEventListener('change', (e) => {
            currentDbUrl = e.target.value;
            autoLoadDatabase();
        });

        window.performSearch = performSearch;
        window.resetSearch = resetSearch;
        window.changePage = changePage;

        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('resetBtn').addEventListener('click', resetSearch);
        document.getElementById('routeSelect').addEventListener('change', performSearch);
        
        document.getElementById('rowsPerPage').addEventListener('change', (e) => {
            rowsPerPage = parseInt(e.target.value);
            currentPage = 1;
            renderCurrentPage();
        });
        
        document.getElementById('btnPrev').addEventListener('click', () => changePage(-1));
        document.getElementById('btnNext').addEventListener('click', () => changePage(1));
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });

        function initRouteOptions() {
            const select = document.getElementById('routeSelect');
            routeList.forEach(route => {
                const parts = route.split(" - ");
                if (parts.length === 2) {
                    const origin = parts[0];
                    const destination = parts[1];
                    const destCode = portCodes[destination];
                    if (destCode) {
                        const optionValue = `${destCode}|${origin}`;
                        const option = document.createElement('option');
                        option.value = optionValue;
                        option.textContent = route;
                        select.appendChild(option);
                    }
                }
            });
        }

        function renderHeader(columns) {
            const thead = document.getElementById('table-headers');
            thead.innerHTML = '';
            columns.forEach(col => {
                const th = document.createElement('th');
                th.className = "px-6 py-3 text-left text-xs font-medium uppercase tracking-wider border-b border-gray-700";
                th.innerText = col.replace(/_/g, ' ');
                thead.appendChild(th);
            });
        }

        function performSearch() {
            const textInput = document.getElementById('searchInput').value.toUpperCase();
            const routeInput = document.getElementById('routeSelect').value;
            
            let routeDestCode = "";
            let routeOriginName = "";

            if (routeInput) {
                const parts = routeInput.split('|');
                routeDestCode = parts[0];
                routeOriginName = parts[1].toUpperCase();
            }

            const idxInaport = dbColumns.indexOf("INAPORT CODE");
            const idxTibaDari = dbColumns.indexOf("TIBA DARI");
            
            const isRouteFilterActive = routeInput && idxInaport !== -1 && idxTibaDari !== -1;

            filteredData = allData.filter(row => {
                const matchesText = textInput === "" || row.some(cell => String(cell).toUpperCase().includes(textInput));
                let matchesRoute = true;
                if (isRouteFilterActive) {
                    const cellCode = String(row[idxInaport] || "").toUpperCase();
                    const cellOrigin = String(row[idxTibaDari] || "").toUpperCase();
                    matchesRoute = (cellCode === routeDestCode) && (cellOrigin.includes(routeOriginName));
                }
                return matchesText && matchesRoute;
            });

            currentPage = 1;
            renderHeader(dbColumns);
            renderCurrentPage();
            updateTopRowCount(allData.length || 0, filteredData.length || 0);

            if (filteredData.length === 0 && allData.length > 0) {
                document.getElementById('table-wrapper').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
                document.querySelector('#empty-state h3').innerText = "Data tidak ditemukan";
                document.querySelector('#empty-state p').innerText = "Coba ubah kata kunci atau filter rute.";
            } else if (allData.length > 0) {
                document.getElementById('table-wrapper').classList.remove('hidden');
                document.getElementById('empty-state').classList.add('hidden');
            }
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('routeSelect').selectedIndex = 0;
            performSearch();
        }

        function renderCurrentPage() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const totalItems = filteredData.length;
            const totalPages = Math.ceil(totalItems / rowsPerPage);

            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;

            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = Math.min(startIndex + rowsPerPage, totalItems);
            const pageData = filteredData.slice(startIndex, endIndex);

            pageData.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-white hover:bg-blue-50' : 'bg-gray-50 hover:bg-blue-50';
                
                row.forEach((cell, i) => {
                    const td = document.createElement('td');
                    td.className = "px-6 py-4 whitespace-nowrap border-b border-gray-100 text-gray-700 align-top";
                    
                    if (dbColumns[i].toUpperCase().includes("DETAIL") || dbColumns[i].toUpperCase().includes("BONGKAR_MUAT")) {
                        td.innerHTML = formatDetailJSON(cell);
                    } else {
                        td.textContent = cell !== null && cell !== undefined ? cell : '-';
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });

            document.getElementById('start-row').innerText = totalItems === 0 ? 0 : startIndex + 1;
            document.getElementById('end-row').innerText = endIndex;
            document.getElementById('total-rows').innerText = totalItems;
            document.getElementById('page-indicator').innerText = `Halaman ${currentPage} dari ${totalPages || 1}`;

            document.getElementById('btnPrev').disabled = currentPage <= 1;
            document.getElementById('btnNext').disabled = currentPage >= totalPages;
        }

        function changePage(direction) {
            currentPage += direction;
            renderCurrentPage();
        }

        function formatDetailJSON(jsonInput) {
            if (!jsonInput) return '<span class="text-gray-400">-</span>';
            try {
                let data;
                if (typeof jsonInput === 'object') data = jsonInput;
                else data = JSON.parse(jsonInput);
                if (typeof data === 'string') try { data = JSON.parse(data); } catch(e) {}

                let html = '<div class="flex flex-col gap-3 min-w-[300px] max-w-[500px]">';
                let hasContent = false;

                if (data.BONGKAR && Array.isArray(data.BONGKAR) && data.BONGKAR.length > 0) {
                    hasContent = true;
                    html += `
                    <div class="bg-green-50 p-2 rounded border border-green-200 shadow-sm">
                        <div class="flex items-center gap-1 mb-1">
                            <span class="text-xs font-bold text-green-800 bg-green-200 px-2 py-0.5 rounded">BONGKAR</span>
                        </div>
                        <table class="w-full sub-table bg-white">
                            <thead><tr><th>Komoditi</th><th>Jenis</th><th class="text-right">Ton</th><th class="text-right">Unit</th></tr></thead>
                            <tbody>${data.BONGKAR.map(item => `<tr><td class="font-medium text-gray-700">${item.KOMODITIBONGKAR || '-'}</td><td class="text-xs text-gray-500">${item.JENISBONGKAR || '-'}</td><td class="text-right font-mono">${item.TONBONGKAR || '0'}</td><td class="text-right font-mono">${item.UNITBONGKAR || '0'}</td></tr>`).join('')}</tbody>
                        </table>
                    </div>`;
                }

                if (data.MUAT && Array.isArray(data.MUAT) && data.MUAT.length > 0) {
                    hasContent = true;
                    html += `
                    <div class="bg-blue-50 p-2 rounded border border-blue-200 shadow-sm">
                        <div class="flex items-center gap-1 mb-1">
                            <span class="text-xs font-bold text-blue-800 bg-blue-200 px-2 py-0.5 rounded">MUAT</span>
                        </div>
                        <table class="w-full sub-table bg-white">
                            <thead><tr><th>Komoditi</th><th>Jenis</th><th class="text-right">Ton</th><th class="text-right">Unit</th></tr></thead>
                            <tbody>${data.MUAT.map(item => `<tr><td class="font-medium text-gray-700">${item.KOMODITIMUAT || '-'}</td><td class="text-xs text-gray-500">${item.JENISMUAT || '-'}</td><td class="text-right font-mono">${item.TONMUAT || '0'}</td><td class="text-right font-mono">${item.UNITMUAT || '0'}</td></tr>`).join('')}</tbody>
                        </table>
                    </div>`;
                }
                html += '</div>';
                return hasContent ? html : '<span class="text-gray-400 italic">-</span>';
            } catch (e) {
                return `<span class="text-gray-500 text-xs">${String(jsonInput).substring(0, 50)}...</span>`;
            }
        }

        function showLoading(isLoading, text = "Memproses...") {
            const el = document.getElementById('status');
            document.getElementById('status-text').innerText = text;
            if (isLoading) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        function updateTopRowCount(totalCount, filteredCount) {
            const filteredEl = document.getElementById('db-filtered-count');
            if (filteredEl) filteredEl.innerText = filteredCount || 0;
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.innerHTML = `<strong>Error:</strong> ${msg}`;
            el.classList.remove('hidden');
            updateTopRowCount(0, 0);
        }
        
        function hideError() {
            document.getElementById('error').classList.add('hidden');
        }
    </script>
</body>
</html>
